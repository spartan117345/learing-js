<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while</title>
</head>
<body>
    <script>
        i = 0;
        while (i < 6) {
            console.log("el valor de i es: " + i);
            i = i + 1;
        }
    </script>
</body>
</html>
