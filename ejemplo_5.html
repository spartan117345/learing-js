<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cambio de imagen</title>
    <script>
        function cambiarImagen() {
            var imagen = document.getElementById("nombreimagen").value;
            document.getElementById("imagen").src = imagen;
        }
    </script>
    
</head>
<body>
    <img id= "imagen"src="img/escudoGuanenta.png" alt=""onclick="cambiarImagen()">
    <input type="text" id="nombreimagen">
    <button onclick="cambiarImagen()">
        Cambiar Imagen
    </button>
</body>
</html>
